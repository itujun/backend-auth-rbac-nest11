# Nama project di-set EKSPLISIT (bukan mengandalkan nama folder tempat
# project ini di-clone/unzip, yang bisa beda-beda di tiap mesin) --
# dipakai Alloy (observability/alloy/config.alloy) untuk memfilter,
# supaya cuma container project INI yang log-nya ditarik ke Loki, bukan
# ikut menarik log project Docker Compose lain yang kebetulan jalan
# bersamaan di laptop yang sama.
name: rbac-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: rbac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rbac_user
      POSTGRES_PASSWORD: rbac_password
      POSTGRES_DB: rbac_db
    ports:
      - '5432:5432'
    volumes:
      - rbac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rbac_user -d rbac_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Sengaja PIN ke major version + varian alpine, BUKAN `redis:latest`.
  # `latest` adalah moving target -- image bisa berubah versi tanpa
  # disadari tiap kali di-pull ulang (mesin lain, CI, atau rebuild),
  # merusak reproducibility yang sudah dijaga konsisten oleh service
  # `postgres` di atas (yang juga di-pin `16-alpine`, bukan `latest`).
  redis:
    image: redis:7-alpine
    container_name: rbac_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - rbac_redisdata:/data
    # --appendonly yes: aktifkan AOF persistence. Redis di project ini
    # cuma cache-aside (bukan source of truth -- lihat komentar di
    # RedisModule), jadi persistence sebenarnya tidak wajib secara
    # korekt. Tapi tetap diaktifkan supaya restart container dev tidak
    # bikin cache kosong total lalu semua request pertama sesudahnya
    # jadi "thundering herd" ke Postgres sekaligus. Trade-off kecil:
    # sedikit overhead disk I/O, sepadan untuk kebutuhan dev.
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # SMTP lokal untuk dev/testing -- TIDAK mengirim email sungguhan, cuma
  # menangkapnya supaya bisa dilihat di web UI (http://localhost:1080).
  # Dipakai MailService (src/modules/mail) untuk fitur forgot password.
  # Gratis, tanpa API key -- ganti SMTP_HOST/PORT/USER/PASSWORD di .env
  # ke provider asli (mis. Resend/SendGrid) kapan saja tanpa ubah kode,
  # kalau nanti perlu email BENAR-BENAR sampai ke inbox asli (mis. saat
  # deploy live demo).
  maildev:
    image: maildev/maildev:2.1.0
    container_name: rbac_maildev
    restart: unless-stopped
    ports:
      - '1080:1080' # web UI -- buka di browser buat lihat email yang "terkirim"
      - '1025:1025' # SMTP -- inilah yang dipanggil MailService

  # Versi di-pin ke tag stabil spesifik (dicek per Sep 2026) -- BUKAN
  # `:latest`, alasan sama persis seperti Postgres/Redis di atas.
  # Silakan cek ulang & sesuaikan ke rilis stabil terbaru sewaktu-waktu.
  loki:
    image: grafana/loki:3.6.6
    container_name: rbac_loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - rbac_lokidata:/loki
    command: -config.file=/etc/loki/local-config.yaml
    # GANTI dari wget/CMD-SHELL -- base image Loki sejak v3.6.0 distroless,
    # tidak ada /bin/sh maupun wget/curl sama sekali (bukan resource
    # contention seperti dugaan awal, terbukti dari docker inspect:
    # "exec: /bin/sh: stat /bin/sh: no such file or directory" di SETIAP
    # percobaan, gagal instan <1 detik -- bukan gagal karena timeout).
    # Fix resmi dari tim Grafana (github.com/grafana/loki#20149, PR #20590):
    # flag CLI `-health` di binary loki sendiri, dirancang khusus untuk
    # kasus ini -- cek /ready via native Go, tanpa butuh shell/tool
    # eksternal. CMD (exec array, BUKAN CMD-SHELL) -- justru sekarang
    # WAJIB exec-form karena memang tidak ada shell untuk interpret
    # CMD-SHELL string.
    healthcheck:
      test:
        [
          'CMD',
          '/usr/bin/loki',
          '-health',
          '-health.url=http://localhost:3100/ready',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Alloy butuh akses Docker socket HOST (read-only) untuk bisa
  # menemukan & membaca log container lain -- lihat penjelasan lengkap
  # di observability/alloy/config.alloy soal cara kerja & filternya.
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: rbac_alloy
    restart: unless-stopped
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - '12345:12345'
    depends_on:
      loki:
        condition: service_healthy

  # Host port SENGAJA 3300 (bukan 3000 default image) -- port 3000 di
  # HOST sudah dipakai app NestJS kamu sendiri (`npm run start:dev`,
  # lihat `app.port` di configuration.ts). Kalau dipaksa sama-sama
  # 3000, salah satu bakal gagal start karena "port already in use".
  grafana:
    image: grafana/grafana:12.1.0
    container_name: rbac_grafana
    restart: unless-stopped
    ports:
      - '3300:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - rbac_grafanadata:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    depends_on:
      loki:
        condition: service_healthy

  # === OPSIONAL, HANYA untuk demo/verifikasi pipeline observability ===
  # TIDAK ikut jalan di `docker compose up -d` biasa (perlu
  # `--profile full` eksplisit) -- workflow harian tetap
  # `npm run start:dev` di host seperti biasa (lebih cepat, tanpa
  # lapisan container).
  app:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rbac_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://rbac_user:rbac_password@postgres:5432/rbac_db
      REDIS_HOST: redis
    volumes:
      - .:/app
      - /app/node_modules
    # Endpoint & pola SAMA PERSIS dengan `HEALTHCHECK` di Dockerfile
    # production BE (`/api/health`, `wget`, `start_period: 15s`) --
    # sengaja disamakan, bukan kebetulan. `wget` dipakai (bukan `curl`)
    # karena itu yang tersedia bawaan di image Alpine (BusyBox); Node
    # image resmi tidak menginstal `curl` secara default.
    #
    # `start_period: 15s` (bukan lebih pendek) -- `Dockerfile.dev` full
    # `npm ci` + `start:dev` (watch mode ts-node/webpack) butuh waktu
    # cold-start lebih lama dari image production yang sudah di-compile
    # duluan saat `docker build`, jadi start_period-nya disamakan dengan
    # yang production pakai, bukan dipersingkat.
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # FE dijalankan sebagai container OPSIONAL, sama seperti `app` (BE) di
  # atas -- profile 'full', BUKAN workflow harian. `context` relatif ke
  # folder SIBLING `frontend-auth-rbac-svelte5/`, SATU LEVEL di atas repo
  # BE ini (../) -- valid selama kedua repo tetap bersebelahan seperti
  # struktur saat ini.
  frontend:
    profiles: ['full']
    build:
      context: ../frontend-auth-rbac-svelte5
      dockerfile: Dockerfile
    container_name: rbac_frontend
    restart: unless-stopped
    ports:
      - '5173:3000'
    environment:
      # WAJIB tetap "http://localhost:3000" (host-reachable), BUKAN nama
      # service Docker "app" -- browser pengguna jalan di HOST, bukan di
      # dalam network Docker Compose, jadi tidak bisa resolve nama
      # service "app" sama sekali. Lihat src/lib/api/client.ts.
      PUBLIC_API_BASE_URL: http://localhost:3000/api
    depends_on:
      # Sekarang bisa pakai service_healthy, bukan cuma service_started
      # -- `app` di atas sudah punya healthcheck sendiri.
      app:
        condition: service_healthy

volumes:
  rbac_pgdata:
  rbac_redisdata:
  rbac_lokidata:
  rbac_grafanadata:
